<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Детальна інформація про товар</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/details.css">
</head>

<body class="home-page">
<div id="navbar-placeholder"></div>
<div class="header-section">
    <div class="header-content">
        <h1 class="page-title">Управління товарами</h1>
        <p class="page-subtitle">Система обліку та контролю асортименту</p>
    </div>
</div>

<div class="main-content">
    <div class="content-card">
        <div class="card-header">
            <i class="bi bi-table"></i>
            <h2 class="card-title">Список моделей окулярів</h2>
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table">
                    <thead>
                    <tr>
                        <th><i class="bi bi-eyeglasses me-2"></i>Назва моделі</th>
                        <th><i class="bi bi-tag me-2"></i>Ціна закупки</th>
                        <th><i class="bi bi-cash me-2"></i>Ціна продажу</th>
                        <th><i class="bi bi-graph-up me-2"></i>Продано</th>
                        <th><i class="bi bi-box me-2"></i>В наявності</th>
                        <th><i class="bi bi-image me-2"></i>Зображення</th>
                        <th><i class="bi bi-gear me-2"></i>Дії</th>
                        <th><i class="bi bi-bookmark-star me-2"></i>Ідеальний запас</th>
                    </tr>
                    </thead>
                    <tbody id="glasses-list"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="content-card">
        <div class="card-header">
            <i class="bi bi-plus-circle"></i>
            <h2 class="card-title">Додати нову модель</h2>
        </div>
        <div class="card-body">
            <form id="add-glass-form">
                <input type="hidden" id="glassId">
                <input type="hidden" id="oldSoldQuantity" value="">

                <div class="row g-4">
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label for="modelName" class="form-label">
                                <i class="bi bi-pencil"></i>Назва моделі
                            </label>
                            <input type="text" class="form-control" id="modelName" required>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label for="purchasePrice" class="form-label">
                                <i class="bi bi-tag"></i>Ціна закупки
                            </label>
                            <input type="number" class="form-control" id="purchasePrice" required>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label for="salePrice" class="form-label">
                                <i class="bi bi-cash"></i>Ціна продажу
                            </label>
                            <input type="number" class="form-control" id="salePrice" required>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label for="stockQuantity" class="form-label">
                                <i class="bi bi-box"></i>В наявності
                            </label>
                            <input type="number" class="form-control" id="stockQuantity" required>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label for="soldQuantity" class="form-label">
                                <i class="bi bi-graph-up"></i>Продано
                            </label>
                            <input type="number" class="form-control" id="soldQuantity" required>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label for="imageUrl" class="form-label">
                                <i class="bi bi-image"></i>Зображення
                            </label>
                            <input type="text" class="form-control" id="imageUrl" required>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label for="idealStock" class="form-label">
                                <i class="bi bi-star"></i>Ідеальний запас
                            </label>
                            <input type="number" class="form-control" id="idealStock" required>
                        </div>
                    </div>
                </div>
                <button type="submit" class="add-button mt-4">
                    <i class="bi bi-plus-lg"></i>
                    Додати модель
                </button>
            </form>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"></script>
<script>
    fetch('navbar.html')
        .then(response => response.text())
        .then(html => {
            document.getElementById('navbar-placeholder').innerHTML = html;
        });

    document.addEventListener("DOMContentLoaded", function () {
        function loadGlasses() {
            fetch('/api/glasses')
                .then(response => response.json())
                .then(glasses => {
                    const tableBody = document.getElementById("glasses-list");
                    tableBody.innerHTML = "";
                    glasses.forEach(glass => {
                        const row = `
                        <tr>
                                    <td class="fw-medium">${glass.modelName}</td>
                                    <td>${glass.purchasePrice} ₴</td>
                                    <td>${glass.salePrice} ₴</td>
                                    <td>
                                        <span class="stats-badge sold" id="sold-${glass.id}">
                                            <i class="bi bi-graph-up"></i>${glass.soldQuantity}
                                        </span>
                                    </td>
                                    <td>
                                        <span class="stats-badge in-stock" id="stock-${glass.id}">
                                            <i class="bi bi-box"></i>${glass.stockQuantity}
                                        </span>
                                    </td>
                                    <td>
                                        <img src="${glass.imageUrl}" alt="${glass.modelName}" class="product-image">
                                    </td>
                                    <td>
                                        <div class="d-flex gap-2">
                                            <button class="action-button edit" onclick="editGlass(${glass.id})" title="Редагувати">
                                                <i class="bi bi-pencil"></i>
                                            </button>
                                            <button class="action-button delete" onclick="deleteGlass(${glass.id})" title="Видалити">
                                                <i class="bi bi-trash"></i>
                                            </button>
                                        </div>
                                    </td>
                                    <td>
                                        <span class="stats-badge">${glass.idealStock}</span>
                                    </td>
                                </tr>
                    `;
                        tableBody.innerHTML += row;
                    });
                });
        }

        loadGlasses();

        document.getElementById("add-glass-form").addEventListener("submit", function (event) {
            event.preventDefault();

            const glassId = document.getElementById("glassId").value;
            const glassData = {
                modelName: document.getElementById("modelName").value,
                purchasePrice: document.getElementById("purchasePrice").value,
                salePrice: document.getElementById("salePrice").value,
                stockQuantity: document.getElementById("stockQuantity").value,
                soldQuantity: document.getElementById("soldQuantity").value,
                imageUrl: document.getElementById("imageUrl").value,
                idealStock: document.getElementById("idealStock").value
            };

            if (glassId) {
                updateGlass(glassId, glassData);
            } else {
                addNewGlass(glassData);
            }
        });

        function addNewGlass(glassData) {
            fetch("/api/glasses", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(glassData)
            })
                .then(response => response.json())
                .then(data => {
                    loadGlasses();
                    document.getElementById("add-glass-form").reset();
                    document.getElementById("glassId").value = "";
                })
                .catch(error => console.error("Помилка при додаванні моделі:", error));
        }

        function updateGlass(id, glassData) {
            const oldSoldQuantity = parseInt(document.getElementById("oldSoldQuantity").value, 10);
            glassData.oldSoldQuantity = oldSoldQuantity;

            fetch(`/api/glasses/${id}`, {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(glassData)
            })
                .then(response => {
                    if (!response.ok) {
                        throw new Error("Failed to update glass model");
                    }
                    return response.json();
                })
                .then(data => {
                    loadGlasses();
                    document.getElementById("add-glass-form").reset();
                    document.getElementById("glassId").value = "";

                    const newSoldQuantity = glassData.soldQuantity;
                    if (newSoldQuantity) {
                        updateSoldQuantity(id, newSoldQuantity, oldSoldQuantity);
                    }
                })
                .catch(error => console.error("Помилка при оновленні моделі:", error));
        }

        window.editGlass = function (id) {
            fetch(`/api/glasses/${id}`)
                .then(response => response.json())
                .then(glass => {
                    document.getElementById("glassId").value = glass.id;
                    document.getElementById("modelName").value = glass.modelName;
                    document.getElementById("purchasePrice").value = glass.purchasePrice;
                    document.getElementById("salePrice").value = glass.salePrice;
                    document.getElementById("stockQuantity").value = glass.stockQuantity;
                    document.getElementById("soldQuantity").value = glass.soldQuantity;
                    document.getElementById("imageUrl").value = glass.imageUrl;
                    document.getElementById("idealStock").value = glass.idealStock;

                    document.getElementById("oldSoldQuantity").value = glass.soldQuantity;
                })
                .catch(error => console.error("Помилка при отриманні моделі для редагування:", error));
        };

        window.deleteGlass = function (id) {
            if (confirm("Ви впевнені, що хочете видалити цей запис?")) {
                fetch(`/api/glasses/${id}`, {
                    method: "DELETE"
                })
                    .then(() => {
                        loadGlasses();
                    })
                    .catch(error => console.error("Помилка при видаленні моделі:", error));
            }
        };

        function updateSoldQuantity(glassId, newSoldQuantity, oldSoldQuantity) {
            fetch(`/api/glasses/${glassId}/sold`, {
                method: "PUT",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ soldQuantity: newSoldQuantity, oldSoldQuantity: oldSoldQuantity })
            })
                .then(response => response.json())
                .then(updatedGlass => {
                    document.querySelector(`#stock-${glassId}`).textContent = updatedGlass.stockQuantity;
                    document.querySelector(`#sold-${glassId}`).textContent = updatedGlass.soldQuantity;
                    loadGlasses();
                })
                .catch(error => console.error("Помилка при оновленні кількості проданих/в стоці одиниць:", error));
        }
    });
</script>
</body>
</html>
