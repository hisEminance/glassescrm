<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Analytics Dashboard</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

    <link rel="stylesheet" href="/css/analytics.css">
</head>
<body class="home-page">
<div id="navbar-placeholder"></div>

<div class="container main-content">
    <div class="jumbotron">
        <h1 class="display-4">Analytics</h1>
        <p class="lead">Візуалізація фінансових показників</p>
        <hr class="my-4">
    </div>

    <!-- Секція для місячного доходу -->
    <div class="chart-container">
        <h2 class="chart-title">Місячний дохід</h2>
        <canvas id="monthlyRevenueChart"></canvas>
    </div>

    <!-- Секція для тенденцій продажів -->
    <div class="chart-container">
        <h2 class="chart-title">Тенденції продажів</h2>
        <canvas id="salesTrendsChart"></canvas>
    </div>

    <!-- Секція для аналізу витрат -->
    <div class="chart-container">
        <h2 class="chart-title">Аналіз витрат</h2>
        <canvas id="expenseBreakdownChart"></canvas>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script th:inline="javascript">
    fetch('navbar.html')
        .then(response => response.text())
        .then(html => {
            document.getElementById('navbar-placeholder').innerHTML = html;
        })
        .catch(err => {
            console.error('Помилка при завантаженні навбару:', err);
        });
    Chart.defaults.color = '#FFFFFF';
    Chart.defaults.borderColor = '#2E2E44';

    const commonOptions = {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
            legend: {
                labels: {
                    color: '#FFFFFF'
                }
            }
        },
        scales: {
            x: {
                grid: {
                    color: '#2E2E44'
                },
                ticks: {
                    color: '#FFFFFF'
                }
            },
            y: {
                grid: {
                    color: '#2E2E44'
                },
                ticks: {
                    color: '#FFFFFF'
                }
            }
        }
    };
    const monthlyRevenueData = /*[[${monthlyRevenueData}]]*/ [];
    const monthlyRevenueLabels = /*[[${monthlyRevenueLabels}]]*/ [];



    if (monthlyRevenueData.length > 0 && monthlyRevenueLabels.length > 0) {
        const monthlyRevenueCtx = document.getElementById('monthlyRevenueChart').getContext('2d');
        new Chart(monthlyRevenueCtx, {
            type: 'bar',
            data: {
                labels: monthlyRevenueLabels,
                datasets: [{
                    label: 'Дохід за місяць',
                    data: monthlyRevenueData,
                    backgroundColor: 'rgba(54, 162, 235, 0.2)',
                    borderColor: 'rgba(54, 162, 235, 1)',
                    borderWidth: 1
                }]
            },
            options: {
                ...commonOptions
            }
        });
    } else {
        console.warn("Monthly Revenue Data or Labels are empty.");
    }


    const salesTrendsData = /*[[${salesTrendsData}]]*/ [];
    const salesTrendsLabels = /*[[${salesTrendsLabels}]]*/ [];
    console.log("Sales Trends Data:", salesTrendsData);
    console.log("Sales Trends Labels:", salesTrendsLabels);

    if (salesTrendsData.length > 0 && salesTrendsLabels.length > 0) {
        const salesTrendsCtx = document.getElementById('salesTrendsChart').getContext('2d');
        new Chart(salesTrendsCtx, {
            type: 'line',
            data: {
                labels: salesTrendsLabels,
                datasets: [{
                    label: 'Продажі',
                    data: salesTrendsData,
                    borderColor: 'rgba(75, 192, 192, 1)',
                    backgroundColor: 'rgba(75, 192, 192, 0.1)',
                    borderWidth: 2
                }]
            },
            options: {
        ...commonOptions
          }
        });
    } else {
        console.warn("Sales Trends Data or Labels are empty.");
    }

    // Аналіз витрат
    const expenseData = /*[[${expenseData}]]*/ [];
    const expenseCategories = /*[[${expenseCategories}]]*/ [];
    console.log("Expense Data:", expenseData);
    console.log("Expense Categories:", expenseCategories);

    if (expenseData.length > 0 && expenseCategories.length > 0) {
        const expenseCtx = document.getElementById('expenseBreakdownChart').getContext('2d');
        new Chart(expenseCtx, {
            type: 'doughnut',
            data: {
                labels: expenseCategories,
                datasets: [{
                    data: expenseData,
                    backgroundColor: [
                        'rgba(54, 162, 235, 0.8)',
                        'rgba(75, 192, 192, 0.8)',
                        'rgba(255, 206, 86, 0.8)',
                        'rgba(255, 99, 132, 0.8)'
                    ]
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false
            }
        });
    } else {
        console.warn("Expense Data or Categories are empty.");
    }
</script>
</body>
</html>
