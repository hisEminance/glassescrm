<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>CRM</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="/styles.css">
</head>
<body class="home-page">
<div id="navbar-placeholder"></div>

<div class="container main-content">
    <div class="jumbotron">
        <h1 class="display-4">Обіг грошей</h1>
        <p class="lead">Моніторинг доходів та витрат у вашому бізнесі</p>
        <hr class="my-4">
        <p>Використовуйте цю сторінку для управління фінансами та аналізу доходів.</p>
        <p class="lead">
            <a class="btn btn-primary btn-lg" href="/finances" role="button">Переглянути деталі</a>
        </p>
    </div>

    <div class="row mt-4">
        <div class="col-md-4">
            <div class="card text-white bg-success mb-3">
                <div class="card-header">Чистий загальний дохід</div>
                <div class="card-body">
                    <h5 class="card-title" th:text="${netIncome} + ' грн'">0 грн</h5>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card text-white bg-danger mb-3">
                <div class="card-header">Витрати на закупівлю</div>
                <div class="card-body">
                    <h5 class="card-title" th:text="${purchaseExpenses} + ' грн'">0 грн</h5>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card text-white bg-primary mb-3">
                <div class="card-header">Виручка за сьогодні</div>
                <div class="card-body">
                    <h5 class="card-title" th:text="${dailyRevenue} + ' грн'">0 грн</h5>
                </div>
            </div>
        </div>
    </div>
    <div class="row">
        <div class="col-md-6">
            <div class="card text-white bg-info mb-3">
                <div class="card-header">Виручка за цей місяць</div>
                <div class="card-body">
                    <h5 class="card-title" th:text="${monthlyRevenue} + ' грн'">0 грн</h5>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card text-white bg-warning mb-3">
                <div class="card-header">Виручка за цей рік</div>
                <div class="card-body">
                    <h5 class="card-title" th:text="${yearlyRevenue} + ' грн'">0 грн</h5>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"></script>
<script>
    fetch('navbar.html')
        .then(response => response.text())
        .then(html => {
            document.getElementById('navbar-placeholder').innerHTML = html;
        })
        .catch(err => {
            console.error('Помилка при завантаженні навбару:', err);
        });
</script>
</body>
</html>
